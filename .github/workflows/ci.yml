name: CI

on: [push]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux:
    name: Linux (Ubuntu)
    uses: ./.github/workflows/ci-linux.yml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit

  windows-ucrt64:
    name: Windows (UCRT64)
    uses: ./.github/workflows/ci-windows-ucrt64.yml
    secrets: inherit

  windows-msvc:
    name: Windows (MSVC)
    uses: ./.github/workflows/ci-windows-msvc.yml
    secrets: inherit

  windows-msys2:
    name: Windows (MSYS2)
    uses: ./.github/workflows/ci-windows-msys2.yml
    secrets: inherit

  wasm:
    name: WebAssembly
    uses: ./.github/workflows/ci-wasm.yml
    secrets: inherit
