name: CI

on: [push]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7

    - name: Build
      run: make gcc && ls -l build

    - name: Test
      run: cd test && make && ls -l

    - name: Build dictionaries
      run: cd dict2 && make && ls -l

    - name: Profiling
      run: cd src/testdir && make profile && ls -l

    - name: Upload profile.log
      uses: actions/upload-artifact@v7
      with:
        path: src/testdir/profile.log
        archive: false
